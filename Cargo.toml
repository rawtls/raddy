[package]
name = "raddy"
version = "0.3.0"
edition = "2024"
description = "High-performance HTTPS reverse proxy with Cloudflare DNS-01"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.11"
cel = { version = "0.16", default-features = false, features = ["regex"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
glob = "0.3"
hickory-resolver = "0.26"
httparse = "1.10"
http = "1.4"
http-body-util = "0.1"
httpdate = "1.0"
hyper = { version = "1.8", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
ipnet = "2.12"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
libc = "0.2"
mime_guess = "2.0"
percent-encoding = "2.3"
regex = "1.12"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "http2", "json", "rustls-tls-webpki-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
x509-parser = "0.18"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
